name: RISE
options:
  bundleIdPrefix: com.borwon
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  RISE:
    build:
      targets:
        RISE: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  RISE:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RISE
        excludes:
          - "Resources/Info.plist"
      - path: Shared
    info:
      path: RISE/Resources/Info.plist
      properties:
        CFBundleDisplayName: RISE.
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAlarmKitUsageDescription: RISE. schedules the wake-up alarms you create so they ring on time, even when the app is closed.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borwon.rise
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: RISEAlarmWidget
        embed: true

  RISEAlarmWidget:
    type: app-extension
    platform: iOS
    # AlarmKit only exists on iOS 26+, so the extension deploys higher than the
    # app. iOS simply does not load it on iOS 18–25.
    deploymentTarget: "26.0"
    sources:
      - path: RISEAlarmWidget
        excludes:
          - "Info.plist"
      - path: Shared
    info:
      path: RISEAlarmWidget/Info.plist
      properties:
        CFBundleDisplayName: RISE. Alarm
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borwon.rise.widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
