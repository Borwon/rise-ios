name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-screenshot:
    runs-on: macos-26
    timeout-minutes: 35

    env:
      SCHEME: RISE
      BUNDLE_ID: com.borwon.rise

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: |
          brew update --quiet || true
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project RISE.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Boot simulator, install and capture screens
        if: success()
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/RISE.app

          # Fresh install shows onboarding; later launches pass -riseScreen so the
          # capture lands on the requested tab with seeded demo data.
          capture() {
            local name="$1"; shift
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "$@" >/dev/null
            sleep 6
            xcrun simctl io "$UDID" screenshot "$name.png"
          }

          capture 01-onboarding   -riseSeedDemoData
          capture 02-alarms       -riseScreen alarms -riseSeedDemoData
          capture 03-insights     -riseScreen insights -riseSeedDemoData
          capture 04-settings     -riseScreen settings -riseSeedDemoData

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: "*.png"
          if-no-files-found: warn
